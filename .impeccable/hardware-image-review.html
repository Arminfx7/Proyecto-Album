<!doctype html><html lang="es"><meta charset="utf-8"><title>Revisión de fotografías</title><style>body{font:14px system-ui;background:#eee;margin:20px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}article{padding:10px;background:white}img{width:100%;height:175px;object-fit:contain}p{margin:8px 0}</style><main></main><script src="../js/hardware-images.js"></script><script>const start=Number(new URLSearchParams(location.search).get('start'))||0;document.querySelector('main').innerHTML=Object.entries(window.hardwareImages).slice(start,start+12).map(([key,p])=>'<article><img src="../'+p.path+'"><p>'+key+'</p></article>').join('');</script></html>
